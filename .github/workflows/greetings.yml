name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest

    steps:
      - name: Welcome First-Time Contributors
        uses: actions/first-interaction@v3
        with:
          issue_message: |
            👋 Welcome!

            Thank you for opening your first issue!
            We appreciate your contribution.

            Our team will review your issue as soon as possible.

          pr_message: |
            🎉 Welcome!

            Thank you for submitting your first pull request!

            We appreciate your contribution to this project.
            Our team will review your changes soon.
