# ---------------------------
# Registry validation policy
# ---------------------------

validation_policy:

rule_path_must_exist: true

id_must_be_unique: true

format_must_match_path: true

required_mitre_mapping: true

require_validation_for_active_rules: true

require_test_case_for_active_rules: true

require_owner: true

require_severity: true

require_confidence: true

require_related_playbook_for_active_rule: true

deprecated_rule_requirements:
require_replacement_reference: true

retired_rule_requirements:
require_retirement_reason: true

consistency_checks:
- "registry ID exists exactly once"
- "rule path exists"
- "format matches file extension/location"
- "status is valid"
- "severity is valid"
- "confidence is valid"
- "owner exists"
- "MITRE technique IDs are well-formed"
- "active rules have passing validation"
- "active rules have test coverage"
- "indexed rule IDs exist in rules"
- "indexed playbook references exist"
- "related playbooks exist"
- "test assets exist"

# ---------------------------
# Lifecycle
# ---------------------------

lifecycle:

draft:
description: "Rule is under development and is not considered operational."
required_validation: false

experimental:
description: "Rule is usable for testing/hunting but requires further tuning."
required_validation: true

active:
description: "Rule is approved for operational detection."
required_validation: true

deprecated:
description: "Rule should no longer be used for new deployments."
required_validation: false

retired:
description: "Rule is no longer maintained or operationally supported."
required_validation: false
