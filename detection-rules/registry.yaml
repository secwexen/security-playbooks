version: "1.0.0"
schema_version: "1.0.0"

metadata:
name: "Security Playbooks Detection Rule Registry"
description: >
Central registry of detection rules maintained by Security Playbooks.
Each entry identifies the rule artifact, detection format, lifecycle state,
severity, confidence, ownership, MITRE ATT&CK mapping, validation assets,
and operational metadata.
repository: "secwexen/security-playbooks"
license: "MIT"
default_status: "experimental"
default_confidence: "medium"
default_severity: "medium"

# ---------------------------
# Registry conventions
# ---------------------------

conventions:
id_format: "DET-<FORMAT>-<SLUG>"
supported_formats:
- sigma
- yara
- suricata

status_values:
- draft
- experimental
- active
- deprecated
- retired

severity_values:
- informational
- low
- medium
- high
- critical

confidence_values:
- low
- medium
- high

validation_status_values:
- not-tested
- passing
- failing
- needs-review

required_fields:
- id
- name
- format
- path
- status
- severity
- confidence
- owner
- mitre_attack

# ---------------------------
# Ownership
# ---------------------------

owners:
detection-engineering:
team: "Detection Engineering"
description: "Primary owner for detection logic, testing, tuning and lifecycle."

threat-hunting:
team: "Threat Hunting"
description: "Owner for hunt-driven detections and hypothesis validation."

blue-team:
team: "Blue Team"
description: "Operational owner for SOC-focused detections and response workflows."

# ---------------------------
# Detection rules
# ---------------------------

rules:

# ===========================
# Sigma
# ===========================

* id: "DET-SIGMA-LSASS-ACCESS"
  name: "LSASS Process Access Detection"
  format: "sigma"
  path: "detection-rules/sigma/lsass-access.yml"

  status: "active"
  severity: "high"
  confidence: "high"

  owner: "detection-engineering"

  description: >
  Detects suspicious process access to LSASS that may indicate credential
  dumping or memory-based credential access.

  tags:

  * credential-access
  * lsass
  * windows
  * credential-dumping

  mitre_attack:
  tactics:
  - "TA0006"
  techniques:
  - id: "T1003"
  name: "OS Credential Dumping"
  relationship: "primary"
  - id: "T1003.001"
  name: "LSASS Memory"
  relationship: "primary"

  data_sources:

  * "Windows Security Event Log"
  * "Sysmon"
  * "Process Access Telemetry"

  platforms:

  * windows

  validation:
  status: "passing"
  test_cases:
  - "tests/sigma/fixtures/lsass_events.json"
  test_definition: "tests/sigma/test-cases.yaml"
  test_runner: "scripts/run_sigma_tests.py"
  expected_results: "tests/sigma/fixtures/expected_results.json"

  related_playbooks:

  * "playbooks/credential-access/lsass-dump.md"
  * "playbooks/credential-access/credential-dumping.md"
  * "playbooks/triage/suspicious-process-triage.md"

* id: "DET-SIGMA-POWERSHELL-EXEC"
  name: "Suspicious PowerShell Execution"
  format: "sigma"
  path: "detection-rules/sigma/sigma-powershell-exec.yml"

  status: "active"
  severity: "medium"
  confidence: "medium"

  owner: "detection-engineering"

  description: >
  Detects suspicious PowerShell execution patterns associated with command
  execution, script execution, and potentially malicious PowerShell activity.

  tags:

  * execution
  * powershell
  * scripting
  * windows

  mitre_attack:
  tactics:
  - "TA0002"
  techniques:
  - id: "T1059"
  name: "Command and Scripting Interpreter"
  relationship: "primary"
  - id: "T1059.001"
  name: "PowerShell"
  relationship: "primary"

  data_sources:

  * "Windows Event Log"
  * "PowerShell Script Block Logging"
  * "Sysmon"

  platforms:

  * windows

  validation:
  status: "passing"
  test_cases:
  - "tests/sigma/fixtures/powershell_events.json"
  test_definition: "tests/sigma/test-cases.yaml"
  test_runner: "scripts/run_sigma_tests.py"
  expected_results: "tests/sigma/fixtures/expected_results.json"

  related_playbooks:

  * "playbooks/execution/powershell.md"
  * "playbooks/triage/suspicious-powershell-triage.md"
  * "playbooks/defense-evasion/obfuscated-powershell.md"

* id: "DET-SIGMA-SUSPICIOUS-LOGIN"
  name: "Suspicious Login Activity"
  format: "sigma"
  path: "detection-rules/sigma/suspicious-login.yml"

  status: "active"
  severity: "high"
  confidence: "medium"

  owner: "blue-team"

  description: >
  Detects suspicious authentication patterns that may indicate account
  compromise, password spraying, or unauthorized access.

  tags:

  * credential-access
  * initial-access
  * authentication
  * account-compromise

  mitre_attack:
  tactics:
  - "TA0001"
  - "TA0006"
  techniques:
  - id: "T1078"
  name: "Valid Accounts"
  relationship: "primary"
  - id: "T1110"
  name: "Brute Force"
  relationship: "secondary"

  data_sources:

  * "Windows Authentication Logs"
  * "Identity Provider Logs"
  * "VPN Logs"

  platforms:

  * windows
  * identity

  validation:
  status: "passing"
  test_cases:
  - "tests/sigma/fixtures/suspicious_login_events.json"
  test_definition: "tests/sigma/test-cases.yaml"
  test_runner: "scripts/run_sigma_tests.py"
  expected_results: "tests/sigma/fixtures/expected_results.json"

  related_playbooks:

  * "playbooks/triage/suspicious-login-triage.md"
  * "playbooks/response/account-compromise-response.md"
  * "playbooks/initial-access/valid-account-compromise.md"
  * "playbooks/credential-access/password-spraying.md"

