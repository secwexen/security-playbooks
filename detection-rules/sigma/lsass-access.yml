title: Suspicious LSASS Process Access
id: 6d8c1d4e-2f31-4b4a-9e20-7c6a9d8f1352
status: experimental
description: |
  Detects processes accessing the Local Security Authority Subsystem
  Service (LSASS) process using Sysmon Event ID 10.
  Unexpected LSASS process access may indicate credential dumping
  activity or attempts to access sensitive authentication material.
author: Secwexen
date: 2026/09/24

references:
  - https://attack.mitre.org/techniques/T1003/001/

tags:
  - attack.credential-access
  - attack.t1003
  - attack.t1003.001
  - lsass
  - credential-dumping

logsource:
  product: windows
  service: sysmon

detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'

  condition: selection

falsepositives:
  - Legitimate endpoint security software accessing LSASS
  - Endpoint monitoring and forensic tools
  - Authorized administrative troubleshooting
  - Security products performing credential protection or inspection

level: high
