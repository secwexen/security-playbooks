title: Windows Failed Logon Event
id: 8f4c2d91-7a63-4e5b-9c21-6d0f3a8b1257
status: experimental
description: |
  Detects failed Windows authentication attempts using Security
  Event ID 4625.
  Failed logon events may indicate authentication failures,
  password guessing attempts, or other suspicious account activity.
  A single failed logon event does not independently confirm
  brute-force activity.
author: Secwexen
date: 2026/11/22

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4625

  condition: selection

falsepositives:
  - Users entering incorrect passwords
  - Expired or recently changed passwords
  - Applications attempting authentication with outdated credentials
  - Automated services performing unsuccessful authentication

level: low

tags:
  - windows
  - authentication
  - failed-logon
