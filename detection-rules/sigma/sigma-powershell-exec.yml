title: PowerShell Encoded Command Execution
id: f1a2b3c4-d5e6-7890-1234-56789abcdef0
status: experimental
description: |
  Detects PowerShell and PowerShell Core processes executing commands
  with encoded command-line parameters.
  Encoded PowerShell commands may be used to obfuscate malicious
  scripts and evade basic command-line inspection.
author: Secwexen
date: 2026/11/22

references:
  - https://attack.mitre.org/techniques/T1059/001/

tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
  - powershell
  - encoded-command

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_commandline:
    CommandLine|contains:
      - '-encodedcommand'
      - '-enc '

  condition: selection_image and selection_commandline

falsepositives:
  - Legitimate administrative PowerShell scripts using encoded commands
  - Authorized software deployment and configuration management tools
  - Security automation executing encoded PowerShell scripts

level: high
