[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-playbooks"
version = "0.2.1"
description = "Security Playbooks is a collection of MITRE ATT&CK mapping, detection rules (Sigma, YARA, and Suricata), detection validation, and hands-on lab for cybersecurity professionals and SOC analysts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
  { name = "secwexen" }
]

keywords = [
  "cybersecurity",
  "blue-team",
  "defensive-security",
  "playbooks",
  "mitre-attack",
  "detection-engineering",
  "security-validation",
  "detection-rules",
  "threat-hunting",
  "incident-response",
  "sigma",
  "yara",
  "suricata",
  "python",
  "soc"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

dependencies = [
  "pyyaml==6.0.1",
  "ruamel.yaml==0.18.6",
  "jsonschema==4.22.0",
  "requests==2.33.0",
  "click==8.1.7",
  "rich==13.7.1",
  "pysigma==0.11.18",
  "orjson==3.11.6",
  "python-dateutil==2.9.0",
  "validators==0.35.0",
  "tldextract==5.1.2",
  "dnspython==2.7.0",
  "jinja2==3.1.6",
  "structlog==24.4.0",
  "scapy==2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
  "yara-python",
  "black==26.3.1",
  "flake8==7.0.0",
  "isort==5.13.2",
  "pylint==3.3.8",
  "mypy==1.10.0",
  "types-requests",
  "types-PyYAML",
  "types-python-dateutil",
  "types-jsonschema",
  "bandit==1.7.8",
  "pip-audit==2.7.3",
  "pre-commit==3.7.1",
  "yamllint==1.35.1"
]

[project.urls]
Homepage = "https://github.com/secwexen/security-playbooks"
Repository = "https://github.com/secwexen/security-playbooks"
"Bug Tracker" = "https://github.com/secwexen/security-playbooks/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = [
    "automation",
    "tools",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "reports/coverage"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
